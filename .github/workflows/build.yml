name: Build Xposed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Xposed API
        run: |
          mkdir -p app/libs
          wget -O app/libs/xposed-api.jar https://github.com/rovo89/XposedBridge/raw/master/XposedBridge-api-82.jar

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPhoneGaga_Hook_APK
          path: app/build/outputs/apk/debug/*.apk
